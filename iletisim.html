<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim</title>
    <style>
        body { 
            background-color: #fff0f5; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 90vh; /* ortalamak için */
            margin: 0; 
        }
        .iletisim-kart { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            border: 2px dashed #ffb6c1; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            text-align: center; 
            max-width: 350px; 
            width: 100%; 
        }
        .profil-icon { 
            font-size: 60px; 
            margin-bottom: 10px; 
        }
        h2 { 
            color: #ff6b81; 
            margin: 0 0 5px 0; 
            font-size: 26px;
        }
        p.unvan { 
            color: #636e72; 
            font-size: 14px; 
            margin-top: 0; 
            margin-bottom: 30px; 
            font-weight: bold;
        }
        .iletisim-bilgi { 
            background: #fdfbfb; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border: 1px solid #dfe6e9; 
            transition: 0.3s; 
        }
        .iletisim-bilgi:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
            border-color: #ffb6c1; 
        }
        .icon { 
            font-size: 28px; 
        }
        .metin { 
            text-align: left; 
        }
        .metin strong { 
            display: block; 
            color: #2d3436; 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 3px;
        }
        .metin span { 
            color: #d63031; 
            font-weight: bold; 
            font-size: 16px; 
        }
    </style>
</head>
<body>

    <div class="iletisim-kart">
        <div class="profil-icon">👩🏼‍💻</div>
        
        <h2>İrem Nur Çelen</h2>
        <p class="unvan">Bilgisayar Programcılığı</p>

        <div class="iletisim-bilgi">
            <div class="icon">📧</div>
            <div class="metin">
                <strong>E-Posta</strong>
                <span>24400520012@ogr.halic.edu.tr</span>
            </div>
        </div>

        <div class="iletisim-bilgi">
            <div class="icon">📱</div>
            <div class="metin">
                <strong>Telefon</strong>
                <span>[+90 555 000 00 00]</span>
            </div>
        </div>
        
        <p style="margin-top: 30px; font-size: 13px; color: #b2bec3; line-height: 1.5;">
            Projeyle ilgili sorularınız, önerileriniz veya kediler hakkında sohbet etmek için bana dilediğiniz zaman ulaşabilirsiniz! 🐾
        </p>
    </div>

</body>
</html>
